name: build

# كل push يغيّر الكود بيبني ويطلّع إصدار جديد (v1.0.<رقم التشغيل>).
# الويدجت بيفحص آخر إصدار لحاله وبيحدّث نفسه (يحتاج مستودع عام).
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'sounds/**'
      - 'app.manifest'
      - 'build.cmd'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version
        id: ver
        shell: pwsh
        run: |
          $v = "1.0.$env:GITHUB_RUN_NUMBER"
          "version=$v" >> $env:GITHUB_OUTPUT
          $f = 'src/TickWidget.cs'
          $t = [IO.File]::ReadAllText($f)
          $n = $t -replace 'Current = "0\.0\.0"', "Current = `"$v`""
          if ($n -eq $t) { throw 'version marker not found' }
          [IO.File]::WriteAllText($f, $n, (New-Object Text.UTF8Encoding($true)))

      - name: Build TickWidget.exe
        shell: cmd
        run: build.cmd

      - name: Package
        shell: pwsh
        run: |
          if (-not (Test-Path TickWidget.exe)) { throw 'TickWidget.exe was not produced' }
          $h = (Get-FileHash TickWidget.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/TickWidget.exe.sha256", "$h  TickWidget.exe`n")
          New-Item -ItemType Directory -Force dist/TickWidget | Out-Null
          Copy-Item TickWidget.exe, install.cmd, install.ps1, uninstall.cmd, README.md dist/TickWidget/
          Copy-Item sounds dist/TickWidget/sounds -Recurse
          Compress-Archive -Path dist/TickWidget/* -DestinationPath TickWidget.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: TickWidget
          path: |
            TickWidget.zip
            TickWidget.exe
            TickWidget.exe.sha256

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "v${{ steps.ver.outputs.version }}"
          gh release create $v TickWidget.exe TickWidget.exe.sha256 TickWidget.zip --target "${{ github.sha }}" --title $v --generate-notes --latest
